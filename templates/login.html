<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BeatFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .login-container { max-width: 450px; margin-top: 100px; background-color: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #2d2d2d; }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="login-container shadow-lg">
            <h3 class="text-center mb-4 text-success fw-bold">🔐 Account Login</h3>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary">Username:</label>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Password:</label>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">Login</button>
            </form>
            
            <div class="text-center mt-3">
                <span class="text-secondary">Don't have an account?</span> 
                <a href="{{ url_for('register') }}" class="text-primary text-decoration-none">Sign up here</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
