<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - BeatFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a090d; color: #ffffff; }
        .register-card { background-color: #151414; border-radius: 12px; max-width: 450px; margin: 80px auto; padding: 30px; border: 1px solid #222; }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-card shadow">
            <h3 class="text-center text-success mb-4">🎵 Create Account</h3>
            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3"><label class="form-label text-secondary">Username:</label><input type="text" name="username" class="form-control bg-dark text-white border-secondary" required></div>
                <div class="mb-3"><label class="form-label text-secondary">Email Address:</label><input type="email" name="email" class="form-control bg-dark text-white border-secondary" required></div>
                <div class="mb-3"><label class="form-label text-secondary">Password:</label><input type="password" name="password" class="form-control bg-dark text-white border-secondary" required></div>
                <div class="mb-3">
    <label class="form-label text-secondary">Password:</label>
    <input type="password" name="password"
           class="form-control bg-dark text-white border-secondary" required>
</div>

<!-- 🔥 ADD THIS HERE -->
<div class="mb-3">
    <label class="form-label text-secondary">Admin Code (optional):</label>
    <input type="text" name="admin_code"
           class="form-control bg-dark text-white border-secondary"
           placeholder="Enter admin code if you have one">
</div>
                <button type="submit" class="btn btn-success w-100 fw-bold mt-2">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
